# Continuous integration: every push and PR must typecheck, pass the unit
# tests, and produce a production build. SQLite means no services are needed;
# every page is force-dynamic, so `next build` never touches a database.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: No hardcoded colours (design tokens only)
        run: npm run lint:hex

      - name: Claims audit (banned phrases from docs/POSITIONING.md)
        run: npm run claims:audit

      # hyg-04. Fails when a file becomes unreferenced with no baseline row,
      # when a declared dependency becomes unused, or when an imported module
      # is in no manifest. It deletes nothing and never fails for a baselined
      # row — tests/fixtures/repo-refs-baseline.json carries the reasons.
      - name: Hygiene check (unreferenced files and dependency baseline)
        run: npm run hygiene:check

      - name: Production build
        run: npm run build
