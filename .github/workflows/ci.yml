# Continuous integration: every push and PR must typecheck, pass the unit
# tests, and produce a production build. The throwaway-Postgres harness
# (db-02) runs DB-touching tests against a real pgvector service container —
# the same image docker-compose.test.yml runs locally, on the same port — and
# the rest of the suite still mocks the database. The build step needs no
# service of its own: every page is force-dynamic, so `next build` never
# touches a database.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: servo
          POSTGRES_PASSWORD: servo
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U servo -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # The "external" SQL server, mirroring docker-compose.test.yml's extdb
      # (xds-01). CI declares its services by hand rather than invoking the
      # compose file, so a service added there does not reach here on its own —
      # and without it tests/kb-source-schema.test.ts cannot prove the
      # never-Servo's-own-database guard against two real endpoints, which is
      # xds-01's last acceptance criterion. `npm test` exits 1 without it.
      extdb:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: servo
          POSTGRES_PASSWORD: servo
          POSTGRES_DB: erp
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U servo -d erp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # The object-store fixture, mirroring docker-compose.test.yml's s3
      # (xds-03) — same reasoning as extdb above: CI declares services by
      # hand, and without s3mock tests/kb-source-s3.test.ts cannot run its
      # crawl against a real endpoint. initialBuckets pre-creates the
      # bucket the suite's uploader seeds.
      s3:
        image: adobe/s3mock:latest
        env:
          initialBuckets: fixtures
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The backup-restore check (db-07) shells out to pg_dump/psql; the
      # runner's default client lags the pgvector:pg17 service, and
      # pg_dump refuses a version mismatch — and CI's `services:` container
      # cannot be docker-exec'd the way the local fallback does. Install
      # the matching client from pgdg.
      - name: Install PostgreSQL 17 client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: No hardcoded colours (design tokens only)
        run: npm run lint:hex

      - name: Claims audit (banned phrases from docs/POSITIONING.md)
        run: npm run claims:audit

      # hyg-04: nothing may become unreferenced without a reason. The keep-list
      # is tests/fixtures/repo-refs-baseline.json; this step deletes nothing.
      - name: Hygiene check (unreferenced files and dependencies)
        run: npm run hygiene:check

      - name: Production build
        run: npm run build
