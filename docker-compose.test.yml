# The throwaway-Postgres test container (spec item db-02). Port 5433 so it
# never collides with a dev instance; tmpfs for the data directory so nothing
# survives and nothing needs cleaning.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The "external" SQL server. docs/design/external-sources.md's offline-
  # testability table assigns this service to the xds-* area and xds-04's
  # acceptance describes it; it lands HERE, at xds-01, because xds-01's last
  # acceptance criterion is "against a second local Postgres on 5434", and a
  # criterion that names a second live endpoint cannot be met without one.
  # Deliberately a DIFFERENT
  # instance from the 5433 test database, because "a data source may never
  # point at Servo's own database" is only provable against two real
  # endpoints — one that must be accepted and one that must be refused.
  # POSTGRES_DB is `erp` rather than `postgres` so the two servers differ by
  # database NAME as well as by port: the guard matches on resolved host
  # addresses and the parsed name, and both hosts here are loopback.
  extdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo
      POSTGRES_DB: erp
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d erp"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # xds-03: the object-store fixture endpoint. s3mock (Apache-2.0) speaks
  # the S3 API on 9090; the crawler's tests put fixture objects into it.
  s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
    environment:
      # s3mock accepts any credentials; the crawler still REFUSES to run
      # without its own sealed pair — the refusal is the test's, not the
      # mock's permissiveness.
      initialBuckets: "fixtures"
