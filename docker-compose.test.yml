# The throwaway-Postgres test container (spec item db-02). Port 5433 so it
# never collides with a dev instance; tmpfs for the data directory so nothing
# survives and nothing needs cleaning.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The "external" SQL server (spec xds-01, canonized in
  # docs/design/external-sources.md). Deliberately a SECOND instance on a
  # SECOND port: "a data source may never point at Servo's own database" is
  # only provable against two real endpoints, and a guard that compares URL
  # strings passes a test with one. No pgvector here — nothing indexes into
  # it; it is the far side of the connection, not a Servo database.
  extdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
