# The throwaway-Postgres test container (spec item db-02). Port 5433 so it
# never collides with a dev instance; tmpfs for the data directory so nothing
# survives and nothing needs cleaning.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The "external" SQL server. docs/design/external-sources.md's offline-
  # testability table assigns this service to the xds-* area and xds-04's
  # acceptance describes it; it lands HERE, at xds-01, because xds-01's last
  # acceptance criterion is "against a second local Postgres on 5434", and a
  # criterion that names a second live endpoint cannot be met without one.
  # Deliberately a DIFFERENT
  # instance from the 5433 test database, because "a data source may never
  # point at Servo's own database" is only provable against two real
  # endpoints — one that must be accepted and one that must be refused.
  # POSTGRES_DB is `erp` rather than `postgres` so the two servers differ by
  # database NAME as well as by port: the guard matches on resolved host
  # addresses and the parsed name, and both hosts here are loopback.
  extdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo
      POSTGRES_DB: erp
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d erp"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The "external" object store (xds-03). adobe/s3mock, Apache-2.0 — re-read
  # from the upstream LICENSE on the tick that landed this, not taken on
  # trust from docs/design/external-sources.md. MinIO would also work and an
  # operator who already runs one should point a DataSource at it, but its
  # server is AGPL-3.0 and there is a zero-cost Apache-2.0 alternative, so
  # the test compose ships the Apache-2.0 one. chrislusf/seaweedfs
  # (Apache-2.0) stays the documented fallback if ListObjectsV2 pagination
  # here ever proves too thin for the cursor tests.
  #
  # PINNED to a version, not `latest`: a test that proves an S3 client's
  # behaviour against a server that silently changes underneath it proves
  # nothing on the day it changes.
  #
  # The bucket is created by the server at boot (`initialBuckets`); the test
  # puts the fixture objects in. Servo's own code never writes to an object
  # store and a test asserts that, so the seeding is the test's job and the
  # crawler's import list stays three read commands wide.
  s3:
    image: adobe/s3mock:4.11.0
    environment:
      initialBuckets: "contracts"
      # Everything lives in the container's own filesystem and dies with it,
      # exactly like the two databases above.
      retainFilesOnExit: "false"
    ports:
      - "9090:9090"
    restart: unless-stopped
