services:
  db:
    # The official `postgres` image does NOT ship pgvector — this one does.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: servo
      POSTGRES_PASSWORD: servo # override in production
      POSTGRES_DB: servo
    volumes:
      - servo-db:/var/lib/postgresql/data
      # Idempotent setup for the ops sandbox — the servo_ops database, its
      # two login roles and the revokes. Only ever runs on an EMPTY data
      # directory: docs/migrating-to-postgres.md carries the same SQL for
      # volumes that already exist.
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-servo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servo -d servo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  servo:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://servo:servo@db:5432/servo?schema=public"
      # The ops sandbox: its own database and its own roles, created by
      # scripts/postgres-init.sql. The read URL is the role whose grants are
      # SELECT and nothing else; change both passwords alongside
      # POSTGRES_PASSWORD in production.
      OPS_DATABASE_URL: "postgresql://servo_ops_rw:servo_ops@db:5432/servo_ops"
      OPS_DATABASE_READONLY_URL: "postgresql://servo_ops_ro:servo_ops@db:5432/servo_ops"
      # Production checklist (see SECURITY.md):
      # AUTH_SECRET: "any-long-random-string"            # session signing
      # SERVO_ENCRYPTION_KEY: "64-hex-or-passphrase"     # secrets encrypted at rest
      # APP_URL: "https://servo.company.com"             # links in notifications
      # Bring your own key (optional — without it Servo runs in mock mode):
      # ANTHROPIC_API_KEY: "sk-ant-..."
      # First boot only: load the fictional showcase dataset instead of a
      # clean install (never combine with real use):
      # SERVO_DEMO: "1"
    volumes:
      # Legacy SQLite volume: kept one release so upgraders can run the
      # one-shot import (db-07) against /data/servo.db; removable after.
      # The app itself no longer reads it.
      - servo-data:/data
    restart: unless-stopped

volumes:
  servo-db:
  servo-data:
