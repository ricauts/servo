<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Servo — open-source ticketing</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>body{margin:0}</style>
</head><body class="servo-light"><div id="root"></div>
<script type="text/babel" src="Charts.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState("dashboard");
  const [ticket, setTicket] = React.useState(null);
  const go = (r) => { setRoute(r); if (r !== "ticket") setTicket(null); };
  let screen;
  if (route === "dashboard") screen = <DashboardScreen />;
  else if (route === "tickets") screen = <TicketsScreen onOpen={(t) => { setTicket(t); setRoute("ticket"); }} />;
  else if (route === "ticket") screen = <TicketDetailScreen ticket={ticket} onBack={() => go("tickets")} />;
  else if (route === "approvals") screen = <ApprovalsScreen />;
  else if (route === "agents") screen = <AgentsScreen />;
  else screen = <StubScreen title={route.charAt(0).toUpperCase() + route.slice(1)} />;
  return <AppShell route={route === "ticket" ? "tickets" : route} onRoute={go}>{screen}</AppShell>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
