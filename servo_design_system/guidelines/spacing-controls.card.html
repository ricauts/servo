<!-- @dsCard group="Spacing" viewport="700x140" name="Control heights" subtitle="32px is the desk default; 44px for marketing and touch." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Control heights</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:var(--space-6);align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="row" style="align-items:center;gap:14px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="height:24px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:var(--surface);color:var(--text-body);font-size:13.5px">Approve</div><span class="lbl">xs · 24px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="height:28px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:var(--surface);color:var(--text-body);font-size:13.5px">Approve</div><span class="lbl">sm · 28px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="height:32px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:var(--surface);color:var(--text-body);font-size:13.5px">Approve</div><span class="lbl">md · 32px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="height:36px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:var(--surface);color:var(--text-body);font-size:13.5px">Approve</div><span class="lbl">lg · 36px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="height:44px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-3);background:var(--surface);color:var(--text-body);font-size:13.5px">Approve</div><span class="lbl">xl · 44px</span></div>
</div></body></html>
