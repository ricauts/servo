<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:var(--space-6);align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="row" style="gap:16px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:72px;height:52px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:4px"></div><span class="lbl">radius-1</span><span class="lbl" style="color:var(--text-muted)">4px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:72px;height:52px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px"></div><span class="lbl">radius-2</span><span class="lbl" style="color:var(--text-muted)">6px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:72px;height:52px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px"></div><span class="lbl">radius-3</span><span class="lbl" style="color:var(--text-muted)">8px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:72px;height:52px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px"></div><span class="lbl">radius-4</span><span class="lbl" style="color:var(--text-muted)">10px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:72px;height:52px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px"></div><span class="lbl">radius-5</span><span class="lbl" style="color:var(--text-muted)">14px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:72px;height:52px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px"></div><span class="lbl">radius-full</span><span class="lbl" style="color:var(--text-muted)">999px</span></div>
</div></body></html>
