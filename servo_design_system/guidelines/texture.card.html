</div>
<div style="position:absolute;left:24px;top:44px"><span class="lbl" style="background:var(--brand-soft);border:1px solid var(--brand-soft-line);color:var(--text-brand);padding:3px 7px;border-radius:3px">open-source ai service desk</span><div style="margin-top:10px;font-size:26px;font-weight:600;letter-spacing:-.03em;color:var(--text-strong)">Grounded, not decorated</div></div>
</div></body></html>
