<!-- @dsCard group="Colors" viewport="700x150" name="Text ramp" subtitle="Four steps of ink on dark, plus the blue link colour." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Text ramp</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:var(--space-6);align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:14px"><span class="lbl" style="width:120px">--text-strong</span><span style="color:var(--text-strong);font-size:16px;font-weight:600">Star on GitHub button is unreadable</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="lbl" style="width:120px">--text-body</span><span style="color:var(--text-body);font-size:13.5px">Email becomes tickets; agents work them with real tools.</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="lbl" style="width:120px">--text-muted</span><span style="color:var(--text-muted);font-size:13.5px">Requested 4m ago by Developer Agent</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="lbl" style="width:120px">--text-faint</span><span style="color:var(--text-faint);font-family:var(--font-mono);font-size:11.5px">github_edit_file · github_open_pr</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span class="lbl" style="width:120px">--text-link</span><a href="#" style="font-size:13.5px">View the run transcript</a></div>
</div></body></html>
