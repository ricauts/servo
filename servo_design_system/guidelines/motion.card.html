<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Short, linear-feeling easing. Hover recolours; press drops 1px." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:var(--space-6);align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div class="row" style="gap:10px;align-items:center"><button class="svo-btn v-primary">Hover me</button><button class="svo-btn v-outline">Outline</button><button class="svo-btn v-subtle">Subtle</button><button class="svo-btn v-danger">Reject</button><span class="lbl">120ms · cubic-bezier(0.2,0,0,1)</span></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="padding:10px;border:1px solid var(--line);border-radius:var(--radius-3);background:var(--surface)"><div class="lbl">dur-1 120ms</div><div style="margin-top:4px;font-size:12.5px;color:var(--text-muted)">hover, colour</div></div><div style="padding:10px;border:1px solid var(--line);border-radius:var(--radius-3);background:var(--surface)"><div class="lbl">dur-2 180ms</div><div style="margin-top:4px;font-size:12.5px;color:var(--text-muted)">menus, tooltips</div></div><div style="padding:10px;border:1px solid var(--line);border-radius:var(--radius-3);background:var(--surface)"><div class="lbl">dur-3 280ms</div><div style="margin-top:4px;font-size:12.5px;color:var(--text-muted)">sheets, panels</div></div><div style="padding:10px;border:1px solid var(--line);border-radius:var(--radius-3);background:var(--surface)"><div class="lbl">dur-4 600ms</div><div style="margin-top:4px;font-size:12.5px;color:var(--text-muted)">marketing reveals</div></div>
</div>
</div></body></html>
