<!-- @dsCard group="Spacing" viewport="700x160" name="Borders & elevation" subtitle="On dark, depth is a hairline plus a 1px inset highlight — not a drop shadow." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:var(--space-6);align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="row" style="gap:14px">
<div style="flex:1;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-4);box-shadow:var(--inset-top)"><div class="lbl">card · line + inset-top</div><div style="margin-top:8px;color:var(--text-body);font-size:13.5px">Resolved · 30d</div></div>
<div style="flex:1;padding:14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-4);box-shadow:var(--shadow-2)"><div class="lbl">popover · shadow-2</div><div style="margin-top:8px;color:var(--text-body);font-size:13.5px">Assign to…</div></div>
<div style="flex:1;padding:14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-4);box-shadow:var(--shadow-3)"><div class="lbl">dialog · shadow-3</div><div style="margin-top:8px;color:var(--text-body);font-size:13.5px">Merge pull request?</div></div>
<div style="flex:1;padding:14px;background:var(--brand-soft);border:1px solid var(--brand-soft-line);border-radius:var(--radius-4);box-shadow:var(--glow-brand)"><div class="lbl" style="color:var(--text-brand)">brand · glow-brand</div><div style="margin-top:8px;color:var(--text-brand);font-size:13.5px">Run AI resolver</div></div>
</div></body></html>
