<!-- @dsCard group="Colors" viewport="700x170" name="Status tones" subtitle="Deep tinted chip, tinted hairline, bright text. Quiet variant for dense rows." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Status tones</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:var(--space-6);align-items:stretch;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div class="row" style="gap:8px"><span class="svo-badge t-serious">Open</span><span class="svo-badge t-brand">Triaged</span><span class="svo-badge t-info">In progress</span><span class="svo-badge t-warn">Waiting approval</span><span class="svo-badge t-good">Resolved</span><span class="svo-badge t-neutral">Closed</span></div>
<div class="row" style="gap:8px"><span class="svo-badge t-neutral">Low</span><span class="svo-badge t-brand">Medium</span><span class="svo-badge t-serious">High</span><span class="svo-badge t-critical">Urgent</span></div>
<div class="row" style="gap:8px"><span class="svo-badge t-good">Low risk</span><span class="svo-badge t-warn">Medium risk</span><span class="svo-badge t-critical">High risk</span><span class="svo-badge t-good">QA PASS</span><span class="svo-badge t-critical">QA FAIL</span><span class="svo-badge t-brand">AI</span></div>
<div class="row" style="gap:8px"><span class="lbl" style="align-self:center">quiet</span><span class="svo-badge is-quiet t-serious">Open</span><span class="svo-badge is-quiet t-brand">Triaged</span><span class="svo-badge is-quiet t-info">In progress</span><span class="svo-badge is-quiet t-warn">Waiting approval</span><span class="svo-badge is-quiet t-good">Resolved</span><span class="svo-badge is-quiet t-neutral">Closed</span></div>
</div></body></html>
